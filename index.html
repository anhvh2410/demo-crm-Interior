<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6a3de8">
<link rel="icon" href="icon.svg">
<title>Nice Life CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* Nice Life CRM — hệ thống thiết kế (phương án A)
   Bố cục: menu trái có dải màu hồng → tím trên máy tính, thanh tab dưới trên điện thoại.
   Nền xám tím rất nhạt, khối trắng bo góc lớn, thẻ chỉ số màu chuyển, bảng có tiêu đề nền tối. */
:root {
  --bg: #f4f5fb;
  --surface: #ffffff;
  --surface-2: #f1f2f8;
  --ink: #1f2140;
  --muted: #5c5f7e;
  --line: #e3e4ef;
  --accent: #5f37df;
  --accent-soft: #f1ecff;
  --accent-ink: #ffffff;
  --g-from: #d6336c;
  --g-to: #6a3de8;
  --grad: linear-gradient(120deg, var(--g-from), var(--g-to));
  --head: #23253f;
  --head-ink: #ffffff;
  --oak: #a3134a;
  --oak-soft: #fde7ef;
  --ok: #1e6b3a;
  --ok-soft: #e6f6ec;
  --warn: #8a4b00;
  --warn-soft: #fff1db;
  --bad: #b42318;
  --bad-soft: #fde8e6;
  --shadow: 0 1px 2px rgba(31, 33, 64, .06), 0 8px 24px rgba(31, 33, 64, .05);
  --font-ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 18px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14152a; --surface: #1d1f38; --surface-2: #272a48; --ink: #ececf8; --muted: #a3a6c4; --line: #33365a;
    --accent: #a88bff; --accent-soft: #2e2752; --accent-ink: #14152a; --head: #0f1024; --head-ink: #ececf8;
    --oak: #ff8fb8; --oak-soft: #3d2033;
    --ok: #6fd39a; --ok-soft: #1b3528; --warn: #f2b964; --warn-soft: #3a2e1b; --bad: #ff8a80; --bad-soft: #3d2222;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14152a; --surface: #1d1f38; --surface-2: #272a48; --ink: #ececf8; --muted: #a3a6c4; --line: #33365a;
  --accent: #a88bff; --accent-soft: #2e2752; --accent-ink: #14152a; --head: #0f1024; --head-ink: #ececf8;
  --oak: #ff8fb8; --oak-soft: #3d2033;
  --ok: #6fd39a; --ok-soft: #1b3528; --warn: #f2b964; --warn-soft: #3a2e1b; --bad: #ff8a80; --bad-soft: #3d2222;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .92em; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.txt-bad { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Khung ---------- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 20px; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; font: 600 17px/1 var(--font-display); letter-spacing: -.01em; }
.brand em { font-style: normal; font: 600 11px/1 var(--font-ui); letter-spacing: .12em; color: var(--muted); padding-top: 3px; }
.brand-mark { width: 22px; height: 22px; border-radius: 4px; background:
  repeating-linear-gradient(90deg, transparent 0 3px, color-mix(in srgb, var(--accent-ink) 22%, transparent) 3px 4px), var(--accent); }
.brand-lg { font-size: 26px; }
.brand-lg .brand-mark { width: 30px; height: 30px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; text-align: left; font-weight: 500; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-on, .nav-on:hover { background: var(--accent-soft); color: var(--accent); }
.side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); }
.me { display: flex; flex-direction: column; }
.me span { color: var(--muted); font-size: 12px; }

.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; min-height: 56px;
  padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.brand-top { display: none; }
.demo-tag { font-size: 12px; color: var(--oak); background: var(--oak-soft); padding: 3px 10px; border-radius: 99px; font-weight: 500; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.content { width: 100%; max-width: 1240px; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.tabbar { display: none; }
.boot { display: grid; place-items: center; height: 100%; color: var(--muted); }

/* ---------- Đầu trang ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.page-head-text { min-width: 0; }
.page-head h1 { font: 600 28px/1.15 var(--font-display); letter-spacing: -.015em; }
.page-sub { margin: 6px 0 0; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.crumb { align-self: flex-start; border: 0; background: none; color: var(--muted); padding: 0; cursor: pointer; margin-bottom: -8px; }
.crumb:hover { color: var(--accent); }

/* ---------- Thành phần ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .55; cursor: progress; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)); border-color: transparent; }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-sm { min-height: 30px; padding: 0 11px; font-size: 13px; }
.full { width: 100%; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.linkish { border: 0; background: none; padding: 0; color: inherit; cursor: pointer; text-align: left; font: inherit; }
.linkish:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.note .linkish { color: var(--accent); margin-left: 6px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-bad { background: var(--bad-soft); color: var(--bad); }
.badge-oak { background: var(--oak-soft); color: var(--oak); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-attn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 40%, var(--surface)); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.panel h2, .side-title { font-size: 15px; font-weight: 600; }
.side-title { margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.note-warn { color: var(--warn); }
.note-bad { color: var(--bad); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.empty-bad { color: var(--bad); }
.cell-sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.big-num { font-size: 24px; font-weight: 600; margin: 0; color: var(--oak); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpis-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.kpi-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi-value { font: 600 26px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--muted); }
.kpi-bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.kpi-bad .kpi-sub { color: var(--bad); font-weight: 600; }

/* Thanh ngang */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 64px; align-items: center; gap: 10px; }
.bar-label { color: var(--muted); font-size: 13px; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 99px; min-width: 2px; }
.bar-oak { background: var(--oak); }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: 1; min-width: 60px; }
.progress-bar { height: 100%; border-radius: 99px; }
.progress-accent { background: var(--accent); } .progress-bad { background: var(--bad); } .progress-oak { background: var(--oak); } .progress-ok { background: var(--ok); }

.status-strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r-sm); overflow: hidden; }
.status-cell { background: var(--surface); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.status-cell strong { font: 600 22px/1 var(--font-display); }
.status-cell span { font-size: 11px; color: var(--muted); }

/* Danh sách dòng */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-stack { flex-direction: column; align-items: stretch; }
.row-main { min-width: 0; }
.row-sub { display: block; color: var(--muted); font-size: 12px; }
.row-actions { display: flex; gap: 6px; flex-shrink: 0; }
.row-meter { display: flex; align-items: center; gap: 10px; min-width: 140px; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }

/* Bảng */
.table-wrap { overflow-x: auto; min-width: 0; }
.table { width: 100%; min-width: 600px; border-collapse: collapse; font-size: 13.5px; }
.table-tight { min-width: 0; }
.table th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table th.num { text-align: right; }
.table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table-click tbody tr { cursor: pointer; }
.table-click tbody tr:hover td { background: var(--surface-2); }
.table-tight td, .table-tight th { padding: 7px 6px; }
.cell-clip { max-width: 280px; }
.table-edit td { padding: 6px 4px; vertical-align: middle; }
.table-edit input, .table-edit select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.table-edit td:first-child input { min-width: 140px; }
.table-edit select { min-width: 150px; }
.table-edit td:nth-child(2) select { min-width: 220px; }
.dims { display: flex; align-items: center; gap: 3px; }
.dims input { width: 62px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; }
.dims span { color: var(--muted); }
.w-qty { width: 60px !important; text-align: right; }
.w-price { width: 110px !important; text-align: right; font-family: var(--font-mono); font-size: 12.5px; }

/* Biểu mẫu */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-wide { grid-column: 1 / -1; }
.field-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field-hint { font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea, .search, .note-form input, .note-form select, .scan-form input, .pay-form input,
.org-table input, .org-table select, .appr-add, .po-line input, .po-line select, .adv-item input, .adv-item select, .rcv-input {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-height: 38px; }
.field textarea { resize: vertical; }
.inline-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.inline-form .note { flex-basis: 100%; margin: 0; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.search { max-width: 340px; }
.tabs { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 8px; align-self: flex-start; }
.tab { border: 0; background: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Bảng kanban */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.board-col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.board-head { display: flex; justify-content: space-between; align-items: center; }
.count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 600; }
.board-cards { display: flex; flex-direction: column; gap: 8px; }
.board-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 12px 0; }
.card-lead { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.card-lead:hover { border-color: var(--accent); }
.card-need { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.card-meta span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Chi tiết */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.detail-main, .detail-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.facts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; }
.facts-inline { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); }
.lock { margin: 14px 0; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--muted); font-size: 13px; }
.lock-on { background: var(--oak-soft); color: var(--oak); }
.mini-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }

.quote { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.quote + .quote { margin-top: 12px; }
.quote-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.quote-code { font-weight: 600; }
.quote-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.quote-items li { display: flex; justify-content: space-between; gap: 16px; font-size: 13.5px; }
.quote-items li > .mono { white-space: nowrap; color: var(--muted); }
.quote-sum { margin: 0; color: var(--muted); font-size: 12.5px; }
.quote-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.quote-foot { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; margin-top: 16px; align-items: start; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0; padding: 14px; background: var(--surface-2); border-radius: 8px; font-variant-numeric: tabular-nums; }
.totals dt { color: var(--muted); }
.totals dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 13px; }
.totals .totals-strong { color: var(--ink); font-weight: 700; font-size: 15px; padding-top: 6px; border-top: 1px solid var(--line); }

.note-form { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 8px; margin-bottom: 14px; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.tl:first-child { border-top: 0; }
.tl-when { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.tl-he_thong .tl-what { color: var(--muted); }

/* Công trình */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card-project { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.card-project:hover { border-color: var(--accent); }
.cp-top { display: flex; justify-content: space-between; align-items: center; }
.cp-code { color: var(--accent); font-weight: 600; }
.cp-name { font-size: 15px; }
.cp-addr { color: var(--muted); font-size: 12.5px; }
.cp-foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.cp-paid { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

.steps { list-style: none; margin: 6px 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.step::before { content: ""; position: absolute; top: 5px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step-done::before, .step-now::before { background: var(--accent); }
.step-dot { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); z-index: 1; }
.step-done .step-dot { background: var(--accent); border-color: var(--accent); }
.step-now .step-dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step-label { font-size: 11px; color: var(--muted); line-height: 1.2; }
.step-now .step-label { color: var(--ink); font-weight: 600; }

.pay-form { display: flex; gap: 6px; justify-content: flex-end; }
.pay-form input { width: 120px; min-height: 30px; padding: 4px 8px; text-align: right; font-family: var(--font-mono); font-size: 12.5px; }

/* Sản xuất */
.prod-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.prod-line { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; margin-bottom: 6px; }
.track { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.track-seg { font-size: 10.5px; text-align: center; padding: 4px 2px; border-radius: 3px; background: var(--surface-2); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-done { background: var(--accent); color: var(--accent-ink); }
.track-now { background: var(--oak-soft); color: var(--oak); font-weight: 600; box-shadow: inset 0 0 0 1px var(--oak); }
.scan { border-color: var(--accent); }
.scan-form { display: flex; gap: 8px; margin-top: 12px; max-width: 520px; }
.scan-form input { font-size: 17px; letter-spacing: .02em; text-transform: uppercase; }
.scan-ok { margin: 10px 0 0; padding: 8px 12px; border-radius: var(--r-sm); background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 13.5px; }
.stage-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.stage-col { display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); padding: 8px; border-radius: 8px; min-height: 90px; }
.stage-col header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; }
.stage-card { display: flex; flex-direction: column; gap: 4px; padding: 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.orders { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 22px; }
.order { display: flex; flex-direction: column; gap: 10px; }
.order + .order { padding-top: 18px; border-top: 1px solid var(--line); }
.order-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }

/* Lắp đặt */
.installs { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
.install { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.install-done { opacity: .85; }
.install-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.install-actions { display: flex; flex-direction: column; gap: 12px; }
.accept-form { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--line); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.photos img { width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: cover; border-radius: 6px; }

/* Hộp thoại */
.modal-back { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(12, 16, 14, .45); }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal-wide { width: min(1080px, 100%); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 8px; }
.modal-head h2 { font: 600 19px/1.2 var(--font-display); }
.modal-body { padding: 8px 18px 16px; overflow: auto; }
.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.foot-total { margin-right: auto; display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.foot-total strong { font-size: 18px; color: var(--ink); }

.toasts { position: fixed; z-index: 40; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { padding: 11px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-weight: 500; font-size: 13.5px; }
.toast-bad { background: var(--bad); color: #fff; }

/* Đăng nhập / chọn vai trò */
.login { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: min(920px, 100%); display: flex; flex-direction: column; gap: 18px; }
.login-narrow { width: min(380px, 100%); padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.login-lede { margin: 0; max-width: 60ch; color: var(--muted); font-size: 15px; }
.role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.role-grid-tight { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.role-card { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.role-card:hover, .role-on { border-color: var(--accent); background: var(--accent-soft); }
.role-name { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.role-hint { font-size: 12.5px; color: var(--muted); }

/* ---------- Màn hình nhỏ ---------- */
@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .detail { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .brand-top { display: flex; font-size: 16px; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content { padding-block: 18px calc(88px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(4px, env(safe-area-inset-left, 0px)); padding-right: max(4px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-top: 1px solid var(--line); }
  .tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; color: var(--muted); font-size: 10.5px; padding: 4px 2px; cursor: pointer; min-width: 0; }
  .tab-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tab-item-on { color: var(--accent); font-weight: 600; }
  .demo-tag { display: none; }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .page-head h1 { font-size: 23px; }
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 560px) {
  .kpis, .kpis-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-value { font-size: 21px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .quote-foot { grid-template-columns: minmax(0, 1fr); }
  .note-form { grid-template-columns: minmax(0, 1fr); }
  .status-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .steps .step-label { font-size: 9.5px; }
  .installs, .cards { grid-template-columns: minmax(0, 1fr); }
  .facts-inline { grid-template-columns: 90px minmax(0, 1fr); }
  .board { grid-auto-columns: minmax(78%, 1fr); }
  .modal-back { align-items: end; padding: 0; }
  .modal { width: 100%; max-height: 92vh; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .search { max-width: none; }
  .row-meter { min-width: 110px; }
  .bar-row { grid-template-columns: 80px minmax(0, 1fr) 56px; }
}

/* =========================================================
   Bổ sung: chi phí, mua hàng, nhập Excel, hồ sơ hợp đồng,
   sản xuất xong/chưa xong, ảnh lắp đặt, biên bản nghiệm thu
   ========================================================= */
.txt-ok { color: var(--ok); }
.txt-warn { color: var(--warn); }
.txt-strong { font-weight: 600; }
.clip-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cell-sub-inline { color: var(--muted); font-size: 12px; margin-left: 6px; }
.w-full { width: 100%; }
.btn-disabled { opacity: .55; pointer-events: none; }

/* Khách kỹ tính */
.demanding { display: inline-flex; }
.card-demanding { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)) !important; box-shadow: inset 3px 0 0 var(--bad); }
.alert-demanding { margin: 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--bad-soft); color: var(--bad); font-size: 13.5px; }
.alert-demanding strong { margin-right: 4px; }
.alert-sm { padding: 7px 10px; font-size: 12.5px; }
.note-block { margin: 0; white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }

/* Nhãn loại hàng / chi phí */
.kind { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .02em; vertical-align: 1px; background: var(--surface-2); color: var(--muted); }
.kind-san_xuat, .kind-c-san_xuat { background: var(--accent-soft); color: var(--accent); }
.kind-mua_ngoai, .kind-c-mua_ngoai { background: var(--oak-soft); color: var(--oak); }
.kind-dich_vu { background: var(--surface-2); color: var(--muted); }
.kind-c-phat_sinh_noi_bo { background: var(--bad-soft); color: var(--bad); }
.kind-c-phat_sinh_khach { background: var(--warn-soft); color: var(--warn); }

/* Báo giá: hạng mục theo không gian */
.qitems { display: flex; flex-direction: column; gap: 14px; }
.qarea-head { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.qarea ul { list-style: none; margin: 0; padding: 0; }
.qitem { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.qitem:last-child { border-bottom: 0; }
.qitem-sub { padding-left: 28px; grid-template-columns: 36px minmax(0, 1fr) auto; }
.qitem-img { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
.qitem-noimg { display: block; }
.qitem-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13.5px; }
.qitem-name { font-weight: 600; }
.qitem-money { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; font-size: 12.5px; color: var(--muted); }
.qitem-money strong { color: var(--ink); font-size: 13.5px; }
.internal { display: block; margin-top: 3px; padding: 3px 8px; border-left: 2px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-size: 12px; border-radius: 0 4px 4px 0; }
.quote-src { margin: 0; font-size: 12.5px; color: var(--muted); }
.terms-list { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.cell-stack { display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
.w-area { width: 130px !important; }
.w-unit { width: 64px !important; }

/* Nhập Excel */
.drop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 20px; border: 2px dashed var(--line); border-radius: var(--r); text-align: center; color: var(--muted); cursor: pointer; }
.drop strong { color: var(--ink); font-size: 15px; }
.drop span { max-width: 60ch; font-size: 13px; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop:hover, .drop-on { border-color: var(--accent); background: var(--accent-soft); }
.import { display: flex; flex-direction: column; gap: 12px; }
.import-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mapping summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
.map-cell { display: flex; flex-direction: column; gap: 3px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 12px; min-width: 0; }
.map-head { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-cell select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.warn-list { margin: 0; padding: 10px 14px 10px 30px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.table-import { min-width: 760px; }
.table-import td { vertical-align: top; font-size: 13px; }
.table-import td:nth-child(2) { min-width: 240px; max-width: 360px; }
.table-import select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.area-row th { background: var(--surface-2); color: var(--ink); font-size: 11.5px; letter-spacing: .06em; }
.row-sub-item td:nth-child(2) { padding-left: 24px; }
.mini-img { width: 72px; height: 54px; object-fit: cover; border-radius: 4px; display: block; }
.terms { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.terms ul { margin: 4px 0 0; padding-left: 18px; }

/* Hồ sơ hợp đồng */
.dossier { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }
.dossier-sec { display: flex; flex-direction: column; gap: 8px; }
.dossier-sec h3 { margin: 0; font-size: 14px; }
.req { font-size: 11px; font-weight: 600; color: var(--bad); margin-left: 6px; text-transform: uppercase; letter-spacing: .04em; }
.link-add { display: flex; gap: 8px; flex-wrap: wrap; }
.link-add input { flex: 1 1 240px; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.links li { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; padding: 4px 8px; background: var(--surface-2); border-radius: 4px; min-width: 0; }
.links a, .link-line { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; max-width: 100%; }
.checklist { padding: 10px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.checklist ul { margin: 4px 0 0; padding-left: 18px; }

/* Ảnh */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.thumbs-sm { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
.thumb { position: relative; margin: 0; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.thumb-img { padding: 0; border: 0; background: none; cursor: zoom-in; border-radius: 6px; overflow: hidden; }
.thumb-img img { width: 100%; aspect-ratio: 1; max-width: 100%; object-fit: cover; display: block; background: var(--surface-2); }
.thumb figcaption { font-size: 11px; color: var(--muted); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb-x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; line-height: 1; font-size: 15px; }
.lightbox { display: block; max-width: 100%; max-height: 72vh; margin: 0 auto; border-radius: 8px; }

/* Lựa chọn dạng nút */
.seg { display: flex; flex-wrap: wrap; gap: 6px; border: 0; padding: 0; margin: 0; }
.seg legend { margin-bottom: 6px; padding: 0; }
.seg-opt { display: inline-flex; align-items: center; padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg-opt input { position: absolute; opacity: 0; pointer-events: none; }
.seg-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.seg-opt:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Chi phí & lãi gộp */
.profit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.profit > div { display: flex; flex-direction: column; gap: 2px; padding: 10px; background: var(--surface-2); border-radius: var(--r-sm); min-width: 0; }
.profit strong { font-size: 13.5px; overflow-wrap: anywhere; }
.bars-tight { gap: 7px; }
.bars-tight .bar-row { grid-template-columns: 96px minmax(0, 1fr) 58px; }
.bar-accent { background: var(--accent); } .bar-bad { background: var(--bad); } .bar-warn { background: var(--warn); }
.cost-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; }
.cost-list li { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.cost-list li > div:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
.cost-right { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.row-change td { background: color-mix(in srgb, var(--warn-soft) 55%, transparent); }
.detail-side .pay-form input { width: 96px; }
.detail-side .table-tight td:first-child { min-width: 72px; }

/* Danh sách tích chọn: sản xuất, mua hàng */
.batch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); border-radius: var(--r-sm); }
.batch-input { flex: 1 1 180px; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-height: 30px; }
.check-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.check-list > li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 4px 10px; padding: 10px 4px; border-top: 1px solid var(--line); }
.check-list > li:first-child { border-top: 0; }
.check-list > li > input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
.check-list .is-done .cl-main > span:first-child { color: var(--muted); }
.check-list .is-sel { background: var(--accent-soft); border-radius: 6px; }
.cl-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 13.5px; cursor: pointer; }
.cl-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.dot { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--line); }
.dot-on { background: var(--ok); border-color: var(--ok); }
.note-btn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.notes { grid-column: 1 / -1; padding: 10px 12px; margin-top: 4px; background: var(--surface-2); border-radius: var(--r-sm); }
.notes .note-form { margin: 10px 0 0; }
.prod-area + .prod-area { margin-top: 10px; }
.prod-area-title { margin: 6px 0 2px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.order.panel { display: flex; flex-direction: column; gap: 10px; }
.order.panel + .order.panel { padding-top: 18px; border-top: 1px solid var(--line); }

/* Lắp đặt: yêu cầu ảnh */
.rule { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r-sm); }
.rule-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13.5px; }
.rule-min { display: inline-flex; align-items: center; gap: 6px; }
.rule-min input { width: 58px; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); text-align: center; }
.photo-check { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); }
.photo-ok { background: var(--ok-soft); }
.pc-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
.pc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pc-list li { padding: 3px 9px; border-radius: 99px; font-size: 12px; background: var(--surface); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.pc-list li::before { content: "○ "; }
.pc-list .pc-done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.pc-list .pc-done::before { content: "✓ "; }
.photo-add { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.photo-add .field { flex: 1 1 220px; }

/* Biên bản nghiệm thu */
.docs { display: flex; flex-direction: column; gap: 12px; }
.doc { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); }
.doc .note { margin: 0; }
.doc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-signed { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: color-mix(in srgb, var(--ok-soft) 35%, var(--surface)); }
.doc-off { opacity: .7; border-style: dashed; }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.handover { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.handover .table-wrap { width: 100%; }
.handover .table { min-width: 520px; }
.handover input:not([type=checkbox]) { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); min-width: 160px; }
.handover input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ok); }
.row-issue td { background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
.paper { background: #fff; color: #1a1a1a; padding: 28px 32px; border: 1px solid #ddd; border-radius: 4px; font: 14px/1.6 var(--font-display); color-scheme: light; }
.paper-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 12px; text-align: center; }
.paper-head strong { font-family: var(--font-ui); font-size: 12px; }
.paper-title { margin: 20px 0 6px; text-align: center; font: 700 18px/1.3 var(--font-display); letter-spacing: .02em; }
.paper-meta { text-align: center; margin: 0 0 14px; font-size: 13px; }
.paper-parties { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 12px; margin: 0 0 14px; }
.paper-parties dt { font-weight: 700; }
.paper-parties dd { margin: 0; }
.paper-table { width: 100%; border-collapse: collapse; font: 13px/1.45 var(--font-ui); margin: 8px 0 12px; }
.paper-table th, .paper-table td { border: 1px solid #999; padding: 5px 8px; text-align: left; vertical-align: top; }
.paper-table th { background: #f1f1f1; }
.paper-table .num { text-align: right; }
.paper-table tfoot td, .paper-sum td { font-weight: 700; }
.paper-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; text-align: center; }
.paper-sign div { display: flex; flex-direction: column; gap: 46px; }
.paper-sign span { font-style: italic; font-size: 13px; }

/* Bảng gọn trong tổng quan */
.table-narrow { min-width: 0; }
.table-click-row { cursor: pointer; }
.table-click-row:hover td { background: var(--surface-2); }
.cp-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.cp-margin { font-size: 12px; color: var(--muted); }

@media (max-width: 560px) {
  .profit { grid-template-columns: minmax(0, 1fr); }
  .qitem { grid-template-columns: 52px minmax(0, 1fr); }
  .qitem-money { grid-column: 2; align-items: flex-start; text-align: left; }
  .paper { padding: 18px 14px; }
  .paper-parties { grid-template-columns: minmax(0, 1fr); }
  .rule-row { flex-direction: column; align-items: flex-start; }
  .check-list > li { grid-template-columns: auto minmax(0, 1fr); }
  .check-list .cl-right, .check-list > li > .badge { grid-column: 2; justify-self: start; flex-direction: row; }
}
@media print {
  body * { visibility: hidden; }
  .paper, .paper * { visibility: visible; }
  .paper { position: absolute; inset: 0; border: 0; }
}
.detail-side .profit { grid-template-columns: minmax(0, 1fr); gap: 4px; }
.detail-side .profit > div { flex-direction: row; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; padding: 8px 10px; }
.detail-side .profit .cell-sub { flex-basis: 100%; text-align: right; }
.detail-side .pay-form input { width: 84px; }

/* Phân công & theo dõi, phân quyền */
.watchers { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 99px; background: var(--oak-soft); color: var(--ink); font-size: 12.5px; }
.chip-role { color: var(--oak); font-size: 11px; font-weight: 600; }
.chip-x { width: 20px; height: 20px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.chip-x:hover { background: var(--surface); color: var(--bad); }
.watch-add { display: flex; gap: 6px; }
.watch-add select { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.watchers .note { margin: 0; }
.assign { grid-template-columns: 84px minmax(0, 1fr); align-items: center; }
.assign select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.cp-tags-left { justify-content: flex-start; }
.alert-info { margin: 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 13.5px; }
.alert-info .linkish { color: var(--accent); margin-left: 6px; }
.perm-table td { vertical-align: middle; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.switch input { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }
.plain-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
/* Bảng thanh toán ở cột hẹp: ô thu tiền xuống dòng riêng */
.detail-side .table-tight thead th:last-child { display: none; }
.detail-side .table-tight tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: start; border-bottom: 1px solid var(--line); }
.detail-side .table-tight thead tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; }
.detail-side .table-tight tbody td { border-bottom: 0; }
.detail-side .table-tight tbody td:last-child { grid-column: 1 / -1; padding-top: 0; }
.detail-side .table-tight tbody td:last-child:empty { display: none; }
.detail-side .pay-form { justify-content: stretch; }
.detail-side .pay-form input { flex: 1; width: auto; }

/* Quản trị */
.admin-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.admin-bar .note { margin: 0; flex: 1 1 320px; }
.admin-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.admin-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.logo-box { display: grid; place-items: center; height: 140px; margin-bottom: 12px; border: 1px dashed var(--line); border-radius: var(--r); background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 16px 16px; }
.logo-box img { max-width: 80%; max-height: 110px; object-fit: contain; }
.brand-mark-lg { width: 56px; height: 56px; }
.brand-logo { height: 26px; width: auto; max-width: 120px; object-fit: contain; }
.brand-lg .brand-logo { height: 36px; }
.brand-preview { margin-top: 14px; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.paper-logo { height: 34px; width: auto; object-fit: contain; }
.paper-head { align-items: center; }
.menu-matrix th.center, .menu-matrix td.center { text-align: center; }
.menu-matrix input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.menu-matrix .dash { color: var(--line); }
.menu-matrix th { white-space: normal; min-width: 64px; }
.row-off td { color: var(--muted); }
.row-off td strong { font-weight: 500; }
@media (max-width: 860px) { .admin-grid { grid-template-columns: minmax(0, 1fr); } }

/* Phân loại khách & tag */
.tone-accent { --tone: var(--accent); --tone-soft: var(--accent-soft); }
.tone-oak { --tone: var(--oak); --tone-soft: var(--oak-soft); }
.tone-ok { --tone: var(--ok); --tone-soft: var(--ok-soft); }
.tone-warn { --tone: var(--warn); --tone-soft: var(--warn-soft); }
.tone-bad { --tone: var(--bad); --tone-soft: var(--bad-soft); }
.tone-neutral { --tone: var(--muted); --tone-soft: var(--surface-2); }
.seg-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--tone); white-space: nowrap; }
.seg-badge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--tone); }
.tag-list { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; background: var(--tone-soft); color: var(--tone); border: 1px solid transparent; white-space: nowrap; }
button.tag { cursor: pointer; font: inherit; font-size: 11.5px; }
.tag-add { background: transparent; border-color: color-mix(in srgb, var(--tone) 35%, transparent); }
.tag-add:hover { background: var(--tone-soft); }
.tag-on { border-color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone); font-weight: 700; }
.tag-x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 2px; font-size: 13px; line-height: 1; opacity: .7; }
.tag-x:hover { opacity: 1; }
.tag-count { font-variant-numeric: tabular-nums; opacity: .75; }
.tag-picker { display: flex; flex-direction: column; gap: 8px; }
.tag-quick { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-new { display: flex; gap: 6px; }
.tag-new input { flex: 1; min-width: 0; padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.tag-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tag-filter .field-label { margin-right: 4px; }
.tag-stats { margin-top: 12px; }
.filter-select { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-height: 38px; max-width: 240px; }
.card-cls { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.classify { display: flex; flex-direction: column; gap: 10px; }
.classify select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.cls-list { list-style: none; margin: 0 0 10px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.cls-list li { display: grid; grid-template-columns: minmax(0, 1fr) 110px 70px 34px; gap: 6px; align-items: center; }
.cls-list input { padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); min-width: 0; }
.tone-select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--tone-soft); color: var(--tone); font-weight: 600; }
.cls-count { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.admin-grid-even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 860px) { .admin-grid-even { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .cls-list li { grid-template-columns: minmax(0, 1fr) 90px 34px; } .cls-count { display: none; } .filter-select { max-width: none; flex: 1; } }

/* =========================================================
   Giao diện phương án A — menu trái dải hồng tím, thẻ chỉ số màu chuyển,
   khối trắng bo góc lớn, bảng tiêu đề nền tối
   ========================================================= */
.shell { grid-template-columns: 248px minmax(0, 1fr); }
.side { padding: 0; gap: 0; border-right: 1px solid var(--line); overflow-y: auto; }
.side-brand { display: flex; align-items: center; gap: 12px; padding: 26px 22px; background: var(--grad); color: #fff; }
.side-brand .brand-tile { background: #fff; color: var(--g-to); }
.side-brand-text { display: flex; flex-direction: column; min-width: 0; }
.side-brand-text strong { font-size: 17px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-brand-text span { font-size: 12px; opacity: .95; }
.side-nav { padding: 18px 14px; gap: 4px; }
.nav-item { min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--ink); font-weight: 500; font-size: 14px; }
.nav-item svg { color: var(--muted); flex: none; }
.nav-item:hover { background: var(--surface-2); }
.nav-on, .nav-on:hover { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-on svg { color: var(--accent); }
.side-foot { margin: auto 14px 14px; padding: 12px; border: 0; border-radius: 14px; background: var(--surface-2); display: flex; align-items: center; gap: 10px; }
.brand-tile { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 700; font-size: 16px; letter-spacing: -.02em; overflow: hidden; }
.brand-tile img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.brand-tile-sm { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 99px; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 600; font-size: 13px; }
.avatar-sm { width: 32px; height: 32px; font-size: 12px; }
.avatar-soft { background: var(--accent-soft); color: var(--accent); }

.topbar { background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom: 0; min-height: 64px; }
.brand-top { align-items: center; gap: 10px; font: 700 16px/1 var(--font-ui); }
.content { max-width: 1320px; gap: 22px; padding-top: 8px; }

.page-head h1 { font: 700 28px/1.2 var(--font-ui); letter-spacing: -.015em; }
.page-sub { font-size: 14px; }

.btn { min-height: 42px; border-radius: 12px; padding: 0 18px; font-weight: 600; }
.btn-sm { min-height: 34px; border-radius: 10px; padding: 0 12px; }
.btn-primary { background: var(--grad); border-color: transparent; color: #fff; }
.btn-primary:hover { background: var(--grad); filter: brightness(1.06); border-color: transparent; }
.btn-ghost { border-color: var(--line); }

.panel { border: 0; border-radius: var(--r); padding: 22px 24px; box-shadow: var(--shadow); }
.panel-head { margin-bottom: 14px; }
.panel h2, .side-title { font-size: 16px; font-weight: 600; }
.panel-attn { border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn-soft) 55%, var(--surface)); }

/* Thẻ chỉ số màu chuyển */
.kpis { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; }
.kpi { border: 0; border-radius: var(--r); padding: 20px 22px; gap: 8px; min-height: 140px; color: #fff; background: linear-gradient(135deg, #c2185b, #7b3fe4); box-shadow: var(--shadow); }
.kpis .kpi:nth-child(4n+2) { background: linear-gradient(135deg, #6a3de8, #2f4fc9); }
.kpis .kpi:nth-child(4n+3) { background: linear-gradient(135deg, #b8360b, #a61e4d); }
.kpis .kpi:nth-child(4n+4) { background: linear-gradient(135deg, #0b6e80, #1a5fa8); }
.kpi-label { color: #fff; font-size: 14px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.kpi-value { font: 700 30px/1.1 var(--font-ui); }
.kpi-sub { color: #fff; font-size: 13px; margin-top: auto; }
.kpi-bad { border: 0; }
.kpi-bad .kpi-sub { color: #fff; }
.kpi-flag { align-self: flex-start; background: rgba(255, 255, 255, .2); padding: 2px 10px; border-radius: 99px; font-weight: 600; }
.kpi-plain { color: var(--ink) !important; background: var(--surface) !important; }
.kpi-plain .kpi-label, .kpi-plain .kpi-sub { color: var(--muted); }

/* Bảng: tiêu đề nền tối */
.table { border-collapse: separate; border-spacing: 0; }
.table thead th { background: var(--head); color: var(--head-ink); font-size: 12px; letter-spacing: .02em; text-transform: none; font-weight: 600; padding: 11px 12px; border-bottom: 0; }
.table thead th:first-child { border-top-left-radius: 10px; }
.table thead th:last-child { border-top-right-radius: 10px; }
.table td { padding: 11px 12px; border-bottom: 1px solid var(--line); }
.table-tight thead th { padding: 9px 8px; }
.table-tight td { padding: 8px; }
.table-click tbody tr:hover td, .table-click-row:hover td { background: var(--accent-soft); }

.tabs { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 5px; gap: 4px; }
.tab { padding: 8px 16px; border-radius: 9px; color: var(--muted); }
.tab-on { background: var(--head); color: var(--head-ink); box-shadow: none; font-weight: 600; }

.badge { padding: 3px 10px; }
.bar-track { height: 10px; }
.bar-fill { background: var(--grad); }
.bar-oak { background: linear-gradient(90deg, #f08c00, #d6336c); }
.progress-accent { background: var(--grad); }
.card-lead, .card-project, .install, .role-card, .quote, .doc { border-radius: 14px; }
.card-lead:hover, .card-project:hover, .role-card:hover { border-color: var(--g-to); }
.board-col { border-radius: 16px; }
.field input, .field select, .field textarea, .search, .filter-select { border-radius: 10px; min-height: 42px; }
.modal { border-radius: 18px; }
.modal-head h2 { font: 700 19px/1.25 var(--font-ui); }
.login-narrow { border: 0; box-shadow: var(--shadow); border-radius: 20px; }
.role-name { color: var(--g-to); }
.brand-lg { font: 700 24px/1 var(--font-ui); gap: 12px; }

/* Tổng quan: biểu đồ */
.dash-row { display: flex; flex-wrap: wrap; gap: 20px; }
.dash-row > * { flex: 1 1 300px; }
.dash-row > .dash-wide { flex: 2 1 480px; }
.area { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; }
.area-y { display: flex; flex-direction: column; justify-content: space-between; height: 196px; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.area svg { width: 100%; height: 196px; display: block; }
.area-x { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.area-x span { flex: 1; text-align: center; }
.area-x span:first-child { text-align: left; } .area-x span:last-child { text-align: right; }
.donut { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
.donut-ring { position: relative; width: 150px; height: 150px; flex: none; }
.donut-ring svg { width: 150px; height: 150px; display: block; transform: rotate(-90deg); }
.donut-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.donut-mid strong { font-size: 26px; font-weight: 700; line-height: 1.1; }
.donut-mid span { font-size: 12px; color: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; flex: 1 1 160px; display: flex; flex-direction: column; gap: 9px; font-size: 13px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend strong { margin-left: auto; font-variant-numeric: tabular-nums; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; font-size: 13px; }
.feed li { display: flex; gap: 12px; }
.feed-dot { flex: none; width: 12px; height: 12px; margin-top: 4px; border-radius: 99px; border: 3px solid var(--g-to); }
.feed-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.feed-body strong { font-weight: 600; }
.feed-body span { color: var(--muted); }
.pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.meter { display: flex; align-items: center; gap: 8px; min-width: 120px; font-size: 12.5px; font-variant-numeric: tabular-nums; }

/* Chi tiết khách: khối hồ sơ */
.profile { display: flex; flex-direction: column; gap: 20px; border-top: 6px solid var(--g-to); }
.profile-top { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 20px; }
.profile-avatar { flex: none; width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center; background: var(--grad); color: #fff; font-size: 24px; font-weight: 700; }
.profile-main { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.profile-name { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.profile-name h1 { font: 700 26px/1.2 var(--font-ui); letter-spacing: -.01em; }
.profile-contact { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--ink); }
.profile-contact > span { display: inline-flex; align-items: center; gap: 6px; }
.profile-contact svg { color: var(--muted); flex: none; }
.profile-contact .muted { color: var(--muted); }
.profile-actions { display: flex; flex-wrap: wrap; gap: 10px; align-self: flex-start; }
.profile-facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-top: 1px solid var(--line); padding-top: 18px; row-gap: 14px; }
.profile-facts > div { display: flex; flex-direction: column; gap: 4px; padding: 0 16px; border-left: 1px solid var(--line); min-width: 0; }
.profile-facts > div:first-child { border-left: 0; padding-left: 0; }
.profile-facts dt { font-size: 12px; color: var(--muted); }

@media (max-width: 560px) {
