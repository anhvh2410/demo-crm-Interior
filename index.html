.tech-block .link-list { list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 4px; } .tech-block .muted { margin-left: 0; }
.due-auto { font-size: 16px; padding: 6px 0 2px; }

/* ---------- Đợt 3: khuyến mại theo nhóm khách, mua hàng, tạm ứng ---------- */
.note-ok { color: var(--ok); }
.benefit { display: inline-flex; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); max-width: 220px; line-height: 1.4; }
.benefit-amount { background: var(--ok-soft); color: var(--ok); }
.benefit-gift { background: var(--warn-soft); color: var(--warn); }
.gift-dd { font-weight: 600; color: var(--warn); }

.po-list, .adv-list { display: flex; flex-direction: column; gap: 10px; }
.po, .adv { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; background: var(--surface); min-width: 0; }
.po-late { border-left-color: var(--bad); background: linear-gradient(90deg, var(--bad-soft), var(--surface) 40%); }
.po-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.po-title { font-weight: 700; text-align: left; }
.po-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 13px; }
.po-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.po-amt { font-weight: 700; white-space: nowrap; }
.po-link { color: var(--accent); font-size: 13px; }
.po-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.po-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.po-lines { display: flex; flex-direction: column; gap: 6px; }
.po-line { display: grid; grid-template-columns: minmax(0, 3fr) 80px 70px 120px 120px 36px; gap: 8px; align-items: center; }
.po-line-head { font-size: 12px; font-weight: 600; color: var(--muted); }
.po-line input, .po-line select { width: 100%; min-width: 0; }
.rcv-input { width: 90px; text-align: right; }
.adv-cho_duyet { border-left-color: var(--warn); }
.adv-tra_lai { border-left-color: #f08c00; }
.adv-da_duyet { border-left-color: var(--accent); }
.adv-da_hoan_ung { border-left-color: var(--ok); }
.adv-tu_choi { border-left-color: var(--bad); opacity: .8; }
.adv-items { display: flex; flex-direction: column; gap: 6px; }
.adv-item { display: grid; grid-template-columns: minmax(0, 3fr) 70px 70px 120px 36px; gap: 8px; align-items: center; }
.adv-item input { width: 100%; min-width: 0; }
@media (max-width: 860px) {
  .po-line, .adv-item { grid-template-columns: 1fr 1fr; }
  .po-line > :first-child, .adv-item > :first-child { grid-column: 1 / -1; }
  .po-line-head { display: none; }
}
.po-line .po-link { grid-column: 1 / -1; margin-top: -2px; }
.po-lines > .btn, .adv-items > .btn { align-self: flex-start; }
.po-list, .adv-list { list-style: none; padding: 0; margin: 0; }
.camp-table td:first-child { min-width: 240px; }
.camp-table td:nth-child(2) { min-width: 180px; }
.camp-table td:nth-child(4) { white-space: nowrap; }

/* ---------- 3.1: bộ phận & chức danh, quyền phê duyệt ---------- */
.appr-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.appr { display: flex; flex-direction: column; gap: 12px; }
.appr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.appr-head h3 { margin: 0 0 2px; font-size: 15px; }
.appr-body { display: flex; flex-direction: column; gap: 12px; }
.appr-body .field-label { display: block; margin-bottom: 6px; }
.appr-body .chips { margin-bottom: 8px; }
.appr-add { width: 100%; max-width: 320px; }
.org-table input, .org-table select { width: 100%; min-width: 140px; }
.org-table td { vertical-align: top; }

/* ---------- 3.2: nhóm phân quyền ---------- */
.role-tab-add { border-style: dashed; color: var(--accent); }
.pg-head { gap: 12px; flex-wrap: wrap; }
.pg-name { font-size: 18px; font-weight: 700; border: 1px solid transparent; border-radius: var(--r-sm); padding: 6px 8px; background: transparent; min-width: 0; flex: 1 1 240px; }
.pg-name:hover, .pg-name:focus { border-color: var(--line); background: var(--surface); }
.pg-desc { width: 100%; margin: 4px 0 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.pg-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.pg-assign { display: flex; flex-direction: column; gap: 8px; }
.pg-assign .field-label small { font-weight: 400; color: var(--muted); }
.pg-link { display: block; text-align: left; color: var(--accent); font-size: 13px; }
@media (max-width: 860px) { .pg-grid { grid-template-columns: 1fr; } }

/* ---------- 3.2: kích hoạt bằng mã ---------- */
.act-title { font-size: 18px; margin: 0; }
.act-links { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-size: 13px; }
.act-link { align-self: center; font-size: 13px; color: var(--accent); }
.otp-input { font-family: var(--mono, ui-monospace, monospace); font-size: 22px !important; letter-spacing: .4em; text-align: center; }
.msg-preview { border-radius: 16px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.msg-preview p { margin: 0; font-size: 14px; line-height: 1.45; }
.msg-zalo { background: #e8f1ff; border-color: #c7dcff; }
.msg-app { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #0068ff; }
.msg-sms .msg-app { color: var(--ok); }
.msg-email p { white-space: pre-line; overflow-wrap: anywhere; }
.msg-email .msg-app { color: var(--accent); }
.msg-note { font-size: 11.5px; color: var(--muted); }
.role-card-invited { border-style: dashed; opacity: .9; }
.otp-log { margin-top: 12px; font-size: 13px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg-zalo { background: #15233d; border-color: #24406e; } }
:root[data-theme="dark"] .msg-zalo { background: #15233d; border-color: #24406e; }

/* ---------- 3.2: vật tư, bảng giá NCC, xuất đơn ---------- */
.tech-mats { margin-top: 14px; }
.mats-table input, .cat-table input, .needs-table input, .needs-table select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.mats-table td:first-child { min-width: 200px; }
.cat-table td:nth-child(2) { min-width: 200px; }
.cat-unit { max-width: 70px; }
.needs-table td:nth-child(2) { min-width: 200px; }
.needs-table select { min-width: 220px; }
.needs-qty { max-width: 80px; text-align: right; }
.needs-price { max-width: 110px; text-align: right; }
.needs-bar { flex-wrap: wrap; gap: 10px; }
.needs-bar .admin-actions { margin-left: auto; }
.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
.export-grid .btn { width: 100%; }
.mats-table { min-width: 860px; }
.mats-table td:nth-child(1) { width: 26%; } .mats-table td:nth-child(2) { width: 22%; }
.mats-table td:nth-child(3) input, .mats-table td:nth-child(4) input { min-width: 64px; }
.mats-table td:nth-child(5) input { min-width: 100px; } .mats-table td:nth-child(6) input { min-width: 120px; }
.cat-table { min-width: 900px; }
.needs-table { min-width: 900px; }
.role-tabs-wrap { flex-wrap: wrap; overflow: visible; }
#pg-who { min-width: 260px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }

/* Phân trang */
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 4px; font-size: 13px; color: var(--muted); }
.pager-info { margin-right: auto; font-variant-numeric: tabular-nums; }
.pager-page { font-variant-numeric: tabular-nums; }
.bell-more { display: block; width: 100%; padding: 10px 8px; text-align: center; color: var(--accent); font-size: 13px; }

/* ---------- Mua hàng: hàng cần mua theo công trình, sản phẩm NCC ---------- */
.kpis-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.buy-progress { display: inline-flex; align-items: center; gap: 8px; min-width: 110px; }
.link-accent { color: var(--accent); font-weight: 600; }
.prod-filters { justify-content: flex-start; gap: 8px; }
.prod-filters .search { flex: 1 1 220px; }
.prod-filters select { min-height: 38px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 0 10px; }
@media (max-width: 760px) { .kpis-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- Chi tiết công trình: tab theo giai đoạn ---------- */
.page-eyebrow { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.meta-line > span:not(:first-child)::before { content: "·"; margin-right: 14px; margin-left: -10px; color: var(--line); }
.panel.panel-steps { padding-bottom: 0; }
.step-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font: inherit; }
.step-btn:hover .step-label { color: var(--accent); }
.ptabs { position: relative; display: flex; gap: 4px; margin: 14px -24px 0; padding: 0 16px; border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { position: relative; display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; padding: 13px 12px 12px; border: 0; background: none; cursor: pointer; color: var(--muted); font: 500 14px/1.2 var(--font-ui); white-space: nowrap; border-bottom: 2px solid transparent; }
.ptab:hover { color: var(--ink); }
.ptab-on { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
.ptab-now { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ptab-count { padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font: 600 11.5px/1.5 var(--font-mono); }
.ptab-on .ptab-count { background: var(--accent-soft); color: var(--accent); }
.detail-main .empty { padding: 14px 12px; font-size: 13.5px; }
@media (max-width: 860px) { .ptabs { margin: 12px -18px 0; padding: 0 8px; } }
@media (max-width: 560px) {
  .ptab { padding: 12px 9px 11px; font-size: 13.5px; }
  .meta-line { font-size: 13px; gap: 2px 12px; }
  .meta-line > span:not(:first-child)::before { display: none; }
}

/* ---------- Bảng thành thẻ trên điện thoại (hàng cần mua, đơn mua, vật tư, biên bản bàn giao) ---------- */
.stack-only { display: none; }
@media (max-width: 640px) {
  .table.table-stack, .table-stack.needs-table, .table-stack.mats-table { min-width: 0; }
  .table-stack thead { display: none; }
  .table-stack, .table-stack tbody { display: block; }
  .table-stack tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 14px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
  .table-stack tr:last-child { border-bottom: 0; }
  .table-stack td { display: block; padding: 0 !important; border: 0 !important; text-align: left !important; min-width: 0; width: auto !important; }
  .table-stack td[data-label]::before { content: attr(data-label); display: block; margin-bottom: 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .table-stack .stack-title { grid-column: 1 / -1; font-weight: 600; }
  .table-stack .stack-hide { display: none; }
  .table-stack .stack-only { display: inline; }
  .table-stack .cell-sub.stack-only { display: block; }
  .table-stack td input:not([type=checkbox]), .table-stack td select { width: 100%; min-width: 0 !important; max-width: none !important; }
  .table-stack .stack-del { position: absolute; right: 0; top: 8px; }
  .mats-edit tr { position: relative; padding-right: 36px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* Hàng cần mua: ô chọn | tên + trạng thái / SL · đơn giá / nhà cung cấp */
  .needs-table tr { grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "sel name name" ". st st" ". pick pick" ". qty price"; }
  .needs-table:not(:has(.nd-sel)) tr { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "name name" "st st" "qty price"; }
  .needs-table .nd-sel { grid-area: sel; padding-top: 2px !important; }
  .needs-table .nd-name { grid-area: name; }
  .needs-table .nd-st { grid-area: st; }
  .needs-table .nd-st:empty { display: none; }
  .needs-table .nd-qty { grid-area: qty; }
  .needs-table .nd-qty input { display: inline-block; width: 70px !important; margin-right: 6px; }
  .needs-table .nd-qty .cell-sub { display: inline; }
  .needs-table .nd-price { grid-area: price; }
  .needs-table .nd-pick { grid-area: pick; }
  .needs-bar .admin-actions { margin-left: 0; width: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
  .needs-bar .admin-actions .btn-primary { flex: 1 1 100%; }

  /* Biên bản bàn giao: không gian nhỏ phía trên, hạng mục + nút Đạt, tồn đọng bên dưới */
  .handover-table tr { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "group ok" "name ok" "issue issue"; gap: 2px 12px; }
  .handover-table .ho-group { grid-area: group; font-size: 11.5px; color: var(--muted); }
  .handover-table .ho-name { grid-area: name; font-weight: 600; }
  .handover-table .ho-ok { grid-area: ok; align-self: center; }
  .handover-table .ho-issue { grid-area: issue; margin-top: 6px; }
  .ho-ok-label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .ho-ok-label:has(input:checked) { border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); background: color-mix(in srgb, var(--ok) 10%, var(--surface)); color: var(--ok); }
  .handover-table .row-issue .ho-ok-label { color: var(--bad); }
  .table-stack tr.row-issue { margin: 0 -8px; padding-left: 10px; padding-right: 10px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
  .table-stack .row-issue td { background: none; }
  .table-stack tr.row-off { opacity: .6; }

  /* Bản xem biên bản: bảng vừa màn hình */
  .paper { padding: 14px 10px; font-size: 13px; }
  .paper-title { font-size: 16px; }
  .paper-table { font-size: 12px; }
  .paper-table th, .paper-table td { padding: 4px 5px; }
  .paper-sign { gap: 10px; }
}

/* ---------- Cột phải công trình: phụ trách gọn, thanh toán / chi phí / báo giá gập lại ---------- */
.detail-side { gap: 12px; }
.panel.team-panel { padding: 16px 20px; }
.team-panel .panel-head { margin-bottom: 8px; }
.team { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 13.5px; }
.team dt { color: var(--muted); font-size: 12.5px; }
.team dd { margin: 0; min-width: 0; }
.team-panel .watchers .note:last-child { display: none; }
.panel.fold { padding: 0; }
.fold-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; cursor: pointer; list-style: none; user-select: none; }
.fold-head::-webkit-details-marker { display: none; }
.fold-head::after { content: ""; width: 8px; height: 8px; margin-left: 2px; flex: none; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .15s; }
.fold[open] > .fold-head::after { transform: rotate(-135deg) translate(-2px, -1px); }
.fold-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
.fold-sum { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: right; min-width: 0; }
.fold-meter { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 110px; }
.fold-meter .progress { flex: none; width: 110px; height: 5px; }
.fold-body { padding: 0 20px 18px; display: flex; flex-direction: column; gap: 12px; }
.fold[open] > .fold-head { padding-bottom: 10px; }
.fold-actions { display: flex; justify-content: flex-end; }
.pay-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pay-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pay-row:first-child { padding-top: 0; }
.pay-main { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
.pay-state { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.pay-state .pay-form { margin-left: auto; }

/* ---------- Menu tài khoản (ảnh đại diện góc phải / chân menu trái) ---------- */
.acct-btn { display: inline-grid; place-items: center; padding: 2px; border: 0; border-radius: 99px; background: none; cursor: pointer; }
.acct-btn:hover .avatar, .acct-btn[aria-expanded=true] .avatar { box-shadow: 0 0 0 3px var(--accent-soft); }
button.side-foot { width: calc(100% - 28px); font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.side-foot:hover { background: var(--accent-soft); }
.side-foot .me { flex: 1; min-width: 0; }
.side-foot > svg { color: var(--muted); }
.acct-back { position: fixed; inset: 0; z-index: 30; }
.acct-menu { position: absolute; top: 60px; right: 16px; width: 300px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 16px; box-shadow: 0 12px 40px rgba(15, 16, 36, .18); border: 1px solid var(--line); padding: 8px; }
.acct-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 12px; }
.acct-head .me { display: flex; flex-direction: column; min-width: 0; }
.acct-head .me span { font-size: 12.5px; color: var(--muted); }
.acct-info { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 4px 10px; margin: 0 0 6px; padding: 10px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.acct-info dt { color: var(--muted); font-size: 12px; }
.acct-info dd { margin: 0; overflow-wrap: anywhere; }
.acct-items { display: flex; flex-direction: column; }
.acct-item { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 500 14px/1.2 var(--font-ui); text-align: left; cursor: pointer; }
a.acct-item { text-decoration: none; }
.acct-item svg { color: var(--muted); flex: none; }
.acct-item:hover { background: var(--surface-2); }
.acct-out, .acct-out svg { color: var(--bad); }
@media (min-width: 861px) { .acct-menu { top: 64px; } .acct-menu-side { top: auto; right: auto; left: 14px; bottom: 96px; } }
@media (max-width: 860px) {
  .acct-back { background: rgba(15, 16, 36, .35); }
  .acct-menu { top: auto; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; border-radius: 18px; padding: 10px; }
  .acct-item { padding: 14px 10px; font-size: 15px; }
}

/* Hướng dẫn lần đầu đăng nhập */
.tour { position: fixed; inset: 0; z-index: 60; }
.tour-dim { position: absolute; inset: 0; background: rgba(15, 16, 36, .55); }
.tour-hole { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(15, 16, 36, .55), 0 0 0 3px var(--accent); transition: top .25s ease, left .25s ease, width .25s ease, height .25s ease; pointer-events: none; }
.tour-card { position: fixed; width: min(340px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border-radius: 18px; padding: 18px 18px 14px; box-shadow: 0 18px 50px rgba(20, 21, 42, .28); outline: none; }
.tour-card h2 { font-size: 18px; margin: 2px 0 6px; }
.tour-card p { margin: 0 0 12px; color: var(--muted); line-height: 1.55; }
.tour-count { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--accent); }
.tour-dots { display: flex; gap: 5px; margin-bottom: 12px; }
.tour-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.tour-dots span.on { background: var(--accent); width: 16px; border-radius: 3px; }
.tour-actions { display: flex; align-items: center; gap: 8px; }
.tour-spacer { flex: 1; }
@media (prefers-reduced-motion: reduce) { .tour-hole { transition: none; } }

/* Nhật ký thay đổi (Quản trị): gọn — chữ nhỏ, một dòng mỗi thay đổi, mở chi tiết ngay dưới dòng */
.audit-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.audit-filters .search { flex: 1 1 220px; max-width: 320px; padding: 6px 10px; font-size: 13px; }
.audit-filters select { padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 13px; min-width: 0; }
.audit-panel { padding: 4px 6px; }
.audit-table { font-size: 12.5px; min-width: 560px; }
.audit-table td { padding: 5px 6px; vertical-align: middle; }
.audit-table td.mono { white-space: nowrap; color: var(--muted); font-size: 11.5px; }
.audit-table .badge { padding: 0 7px; font-size: 11px; }
.audit-table tr.row-on td { background: var(--accent-soft); }
.audit-table tr.audit-open td { background: var(--surface-2); padding: 6px 10px 8px; }
.audit-ent { color: var(--muted); font-size: 11.5px; margin-right: 2px; }
.audit-sum { color: var(--muted); }
.audit-diff { display: grid; gap: 3px; }
.audit-diff-row { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr); gap: 8px; align-items: baseline; }
.audit-field { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.audit-old, .audit-new { display: inline-block; border-radius: 4px; padding: 0 5px; margin-right: 4px; text-decoration: none; overflow-wrap: anywhere; }
.audit-old { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.audit-new { background: var(--ok-soft); color: var(--ok); }
@media (max-width: 640px) { .audit-diff-row { grid-template-columns: minmax(0, 1fr); gap: 0; } }

/* Sao lưu (Quản trị): 3 ô trạng thái + bảng các lần chạy, cùng cỡ chữ gọn với tab Nhật ký */
.backup-alert { margin: 10px 0 0; padding: 7px 12px; border-radius: var(--r-sm); background: var(--bad-soft); color: var(--bad); font-size: 13px; }
.backup-alert-warn { background: var(--warn-soft); color: var(--warn); }
.backup-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 10px; }
@media (max-width: 760px) { .backup-tiles { grid-template-columns: minmax(0, 1fr); } }
.backup-tile { padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.backup-tile-k { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.backup-tile-k .badge { padding: 0 7px; font-size: 11px; letter-spacing: 0; text-transform: none; }
.backup-tile-v { font-size: 14px; font-weight: 600; }
.backup-table { font-size: 12.5px; min-width: 560px; }
.backup-table td { padding: 5px 6px; vertical-align: middle; }
.backup-table td.mono { white-space: nowrap; color: var(--muted); font-size: 11.5px; }
.backup-table .badge { padding: 0 7px; font-size: 11px; }
.backup-empty { padding: 14px 16px; margin-top: 12px; font-size: 13px; }
.backup-empty p { margin: 0; }

/* Kết nối hệ thống (Quản trị): khóa API, webhook */
.int-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.int-head .note { margin-top: 2px; }
.int-head .side-title { margin-bottom: 0; }
section.panel + section.panel { margin-top: 12px; }
.int-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.int-tags .badge, .int-actions .btn { font-size: 11.5px; }
.int-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.key-scopes { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; }
.key-scopes legend { margin-bottom: 6px; padding: 0; }
.key-scopes small { color: var(--muted); margin-left: 4px; }
.secret-once { display: grid; gap: 8px; padding: 12px 14px; border: 1px dashed var(--warn); border-radius: var(--r-sm); background: var(--warn-soft); }
.secret-once-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.secret-once code { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; background: var(--surface, var(--bg)); padding: 6px 8px; border-radius: 6px; user-select: all; }
.secret-once .note { margin: 0; }

/* Quản trị → Email gửi đi */
.email-settings { max-width: 720px; }
.email-status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
.email-test { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-top: 12px; }
.email-test .field { flex: 1 1 260px; margin: 0; }

/* Ô mật khẩu có nút xem / ẩn */
.pw-wrap { position: relative; display: block; }
.pw-wrap input { padding-right: 44px !important; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 34px; display: grid; place-items: center;
  border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: var(--r-sm); }
.pw-eye:hover, .pw-eye[aria-pressed=true] { color: var(--accent); }
.pw-eye:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.txt-ok { color: var(--ok); }
.login-remember { margin-top: -6px; }

/* Quản trị → Email: mẫu thư + xem trước */
.email-tpl { margin-top: 16px; }
.email-tpl-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.email-tpl-form { display: flex; flex-direction: column; gap: 12px; }
.email-tpl-form .form-grid { margin: 0; }
.email-tpl-sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; }
.swatch-on { border-color: var(--surface, #fff); box-shadow: 0 0 0 2px var(--ink); }
.swatch-pick { background: conic-gradient(#e74c3c, #f1c40f, #2ecc71, #3498db, #9b59b6, #e74c3c); overflow: hidden; }
.swatch-pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.email-vars { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.email-vars .field-label { width: 100%; }
.email-var { border: 0; cursor: pointer; padding: 3px 10px; font-family: ui-monospace, monospace; }
.email-tpl-actions { flex-wrap: wrap; }
.email-preview { position: sticky; top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg, #f6f6f8); }
.email-preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.email-preview-bar .seg legend { display: none; }
.email-inbox { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface, #fff); }
.email-subject { font-weight: 600; }
.email-from { font-size: 12.5px; color: var(--muted); }
.email-frame-wrap { padding: 12px; display: flex; justify-content: center; }
.email-frame { width: 100%; max-width: 640px; min-height: 480px; border: 0; background: #fff; border-radius: 8px; display: block; }
.email-frame-phone .email-frame { max-width: 375px; }
@media (max-width: 900px) {
  .email-tpl-grid { grid-template-columns: minmax(0, 1fr); }
  .email-preview { position: static; }
}

/* ---------- Bán hàng trên điện thoại ---------- */
.modal { min-width: 0; }
.ptabs.ptabs-bar { margin: 0; padding: 0 8px; border-top: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.stage-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
.stage-chips::-webkit-scrollbar { display: none; }
.stage-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); font: 500 13.5px/1.2 var(--font-ui); cursor: pointer; white-space: nowrap; }
.stage-chip-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.stage-chip-on .ptab-count { background: var(--surface); color: var(--accent); }
.board.board-one { display: block; overflow: visible; }
.board-one .board-col { background: none; padding: 0; min-height: 0; }
.board-one .board-head { display: none; }
@media (max-width: 860px) {
  .toolbar:has(#lead-search) { gap: 10px; }
  .toolbar:has(#lead-search) .search { flex: 1 1 100%; }
  .toolbar:has(#lead-search) .tabs { margin-left: auto; }
  .toolbar:has(#lead-search) .check { flex: 0 1 auto; white-space: nowrap; }
  .toolbar:has(#lead-search) .tab { padding: 7px 11px; font-size: 13.5px; }
  .panel-quotes > .panel-head { flex-wrap: wrap; }
  .panel-quotes > .panel-head .page-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .panel-quotes > .panel-head .page-actions .btn-primary { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 640px) {
  .lead-table tr { position: relative; }
  .lead-table .stack-title { padding-right: 96px !important; }
  .lead-table .lt-stage { position: absolute; top: 12px; right: 2px; }
  /* Soạn báo giá: mỗi hạng mục một thẻ */
  .quote-edit tr { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-areas: "area area area kind kind kind" "name name name name name name" "dims dims dims dims dims dims" "qty qty unit unit price price" "total total total total total del"; gap: 8px; padding: 14px 0; }
  .quote-edit .qe-area { grid-area: area; } .quote-edit .qe-kind { grid-area: kind; }
  .quote-edit .qe-name { grid-area: name; min-width: 0; }
  .quote-edit .qe-dims { grid-area: dims; display: flex !important; flex-wrap: wrap; }
  .quote-edit .qe-dims::before { flex: 1 1 100%; }
  .quote-edit .qe-dims input { flex: 1; width: auto !important; }
  .quote-edit .qe-qty { grid-area: qty; } .quote-edit .qe-unit { grid-area: unit; } .quote-edit .qe-price { grid-area: price; }
  .quote-edit .qe-total { grid-area: total; align-self: center; font-weight: 600; }
  .quote-edit .qe-total::before { content: "Thành tiền: "; font-weight: 400; color: var(--muted); font-family: var(--font-ui); }
  .quote-edit .qe-del { grid-area: del; justify-self: end; }
  .quote-edit td input, .quote-edit td select { min-width: 0 !important; width: 100% !important; }
  .presets { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: -18px; padding-right: 18px; }
  .presets .btn { flex: none; }
  .modal-foot .foot-total { flex: 1 1 100%; flex-direction: row; justify-content: space-between; align-items: baseline; margin: 0 0 4px; }
  .modal-foot:has(.foot-total) .btn { flex: 1; }
}

/* ---------- Thẻ số liệu Tổng quan bấm được → danh sách ---------- */
button.kpi { font: inherit; text-align: left; cursor: pointer; position: relative; transition: transform .12s, box-shadow .12s; }
button.kpi:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15, 16, 36, .18); }
button.kpi:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.kpi-link::after { content: "›"; position: absolute; top: 14px; right: 16px; font-size: 22px; line-height: 1; opacity: .75; }
@media (max-width: 640px) {
  .kpi-table tr { position: relative; }
  .kpi-table .stack-title { padding-right: 96px !important; }
  .kpi-table .kt-badge { position: absolute; top: 12px; right: 2px; }
}

/* Thanh tab / chip giai đoạn: hiện đủ trong một màn hình, không kéo ngang */
.stage-chips { flex-wrap: wrap; overflow: visible; }
@media (max-width: 860px) {
  .ptabs { flex-wrap: wrap; overflow: visible; row-gap: 0; }
  .ptab { padding: 11px 9px 10px; }
}
@media (max-width: 560px) {
  .ptab { font-size: 13px; padding: 10px 7px 9px; gap: 5px; }
  .ptab-count { padding: 0 5px; font-size: 11px; }
}
/* Thu tiền: phiếu thu, mã QR, công nợ */
.pay-over .pay-main > span:first-child { color: var(--bad); }
.pay-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.receipts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.receipt { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 7px 9px; border-radius: var(--r-sm); background: var(--surface-2); font-size: 12.5px; }
.receipt-code { font-size: 12px; }
.receipt-info { min-width: 0; overflow-wrap: anywhere; }
.receipt-amt { text-align: right; white-space: nowrap; }
.receipt-acts { grid-column: 2 / -1; display: flex; gap: 12px; justify-content: flex-end; }
.receipt-void { opacity: .7; }
.receipt-void .receipt-amt { text-decoration: line-through; }
.receipt .thumbs { margin-top: 6px; }
.qr-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; justify-items: center; padding: 10px 0 2px; }
.qr-card .qr-facts { justify-self: stretch; }
.qr-box { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; width: 168px; }
.qr-img svg { display: block; width: 150px; height: 150px; }
.qr-brand { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: #23253f; }
.qr-brand span:first-child { color: #d6336c; }
.qr-facts { grid-template-columns: 96px minmax(0, 1fr); font-size: 13px; }
.qr-facts dd { overflow-wrap: anywhere; }
.copy-line { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.row-acts { display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.table tr.row-bad td { background: color-mix(in srgb, var(--bad-soft) 60%, transparent); }
.portal-receipts { margin-top: 10px; }
.pay-row .cell-sub .note-btn { margin-left: 6px; }
@media (max-width: 520px) {
  .receipt { grid-template-columns: minmax(0, 1fr) auto; }
  .receipt-info { grid-column: 1 / -1; grid-row: 2; }
}
.row-wrap { flex-wrap: wrap; }
.row-full { flex-basis: 100%; }
</style>
